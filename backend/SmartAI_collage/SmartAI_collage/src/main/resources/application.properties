# File Upload
file.upload-dir=uploads/notes










# Google GenAI Configuration
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=text-embedding-004
spring.ai.google.genai.chat.model=gemini-2.5-pro

# Pinecone Configuration
spring.ai.vectorstore.pinecone.api-key=${PINECONE_API_KEY}
spring.ai.vectorstore.pinecone.index-name=smart-college-index

